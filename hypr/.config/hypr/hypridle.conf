general {
    lock_cmd = hyprlock                      # run hyprlock when locking
    before_sleep_cmd = hyprlock              # lock before system goes to sleep
    after_sleep_cmd = hyprctl dispatch dpms on   # turn screen back on after wake
}

# Lock after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = hyprlock
}

# Turn off screen after 10 minutes (600s)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
