# Fixed Hyprland config using the new unified windowrule syntax
# Refer to: https://wiki.hyprland.org/Configuring/Window-Rules/

source = ~/.config/hypr/macchiato.conf

debug {
  disable_logs = false
  enable_stdout_logs = true
}

################
### MONITORS ###
################

monitor = ,preferred,auto,1
# monitor = HDMI-A-1,1920x1080@60,auto,1, mirror, HDMI-A-2
# monitor = DP-2,1920x1080@60,1920x0,1,transform,1

# exec-once = wl-mirror -o HDMI-A-1 HDMI-A-2


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nautilus
$menu = vicinae toggle
$browser = zen-browser

#################
### AUTOSTART ###
#################

exec-once = hyprctl setcursor BreezeX-Black 28
exec-once = $terminal
exec-once = caelestia shell -d & sleep 2 & hyprpaper 
exec-once = vicinae server
exec-once = pkill swww-daemon; swww-daemon --format xrgb & sleep 0.5 && caelestia wallpaper ~/Pictures/Wallpapers/bg_img.png
exec-once = localsend --hidden
exec-once = hypridle
exec-once = eval $(gnome-keyring-daemon --start); export SSH_AUTH_SOCK=$SSH_AUTH_SOCK
exec-once = kdeconnectd && kdeconnect-indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent
exec-once = tpm-fido
exec-once = /usr/bin/hyprland-per-window-layout
exec-once = /usr/lib/kdeconnectd

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = GDK_BACKEND,wayland,x11
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

#####################
### LOOK AND FEEL ###
#####################

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = $mauve
  col.inactive_border = $overlay0
  resize_on_border = true
  allow_tearing = true
  layout = dwindle
}

decoration {
  rounding = 10
  rounding_power = 2.0
  active_opacity = 0.85
  inactive_opacity = 0.6

  shadow {
    enabled = true
    range = 9
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 10
    passes = 3
    vibrancy = 0.2
    ignore_opacity = true
    new_optimizations = true
  }
}

animations {
  enabled = true
  bezier = easeOutQuint,0.23,1,0.32,1
  bezier = easeInOutCubic,0.65,0.05,0.36,1
  bezier = linear,0,0,1,1
  bezier = almostLinear,0.5,0.5,0.75,1.0
  bezier = quick,0.15,0,0.1,1

  animation = global, 1, 10, default
  animation = border, 1, 5.39, easeOutQuint
  animation = windows, 1, 4.79, easeOutQuint
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation = windowsOut, 1, 1.49, linear, popin 87%
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 1.46, almostLinear
  animation = fade, 1, 3.03, quick
  animation = layers, 1, 3.81, easeOutQuint
  animation = layersIn, 1, 4, easeOutQuint, fade
  animation = layersOut, 1, 1.5, linear, fade
  animation = workspaces, 1, 1.94, almostLinear, fade
}

dwindle {
  pseudotile = true
  preserve_split = true
}

master {
  new_status = master
}

misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

#############
### INPUT ###
#############

input {
  kb_layout = us,es
  kb_options = grp:win_space_toggle,caps:swapescape
  accel_profile = flat
  follow_mouse = 1
  sensitivity = 0
  touchpad {
    natural_scroll = true
  }
}

device {
  name = epic-mouse-v1
  sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, b, exec, $browser
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT ALT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, S, exec, $menu
bind = $mainMod SHIFT, S, exec, caelestia shell drawers toggle launcher
bind = $mainMod, SUPER_L, exec, caelestia shell drawers toggle session
bind = $mainMod, F, fullscreen,

# Clipboard manager
bind = $mainMod, V, exec, vicinae vicinae://extensions/vicinae/clipboard/history

# Lock screen
bind = $mainMod CTRL SHIFT, L, exec, hyprlock
bind = $mainMod, A, exec, caelestia shell drawers toggle dashboard

# Move focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize windows
bind = $mainMod, R,submap,resize
submap = resize
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10
bind = , Return,submap,reset
submap = reset

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, a, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, f, movecurrentworkspacetomonitor, r

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, N, exec, caelestia shell drawers toggle sidebar
bind = $mainMod, PERIOD, exec, emote

# Screenshots
# bind = $mainMod, PRINT, exec, hyprshot -m window
# bind = , PRINT, exec, hyprshot -m output
# bind = $mainMod SHIFT, PRINT, exec, hyprshot -m region --freeze --raw | satty --filename - --output-filename ~/Pictures/Screenshots/Screenshot_$(date +%Y%m%d%H%M%S).png --init-tool brush --copy-command wl-copy

bind = , PRINT, exec, quickshell -c HyprQuickFrame -n
bind = $mainMod, PRINT, exec, HYPRQUICKFRAME_EDITOR=1 quickshell -c HyprQuickFrame -n

# Change keyboard layout (Native Wayland switch)
# bind = $mainMod, SPACE, exec, hyprctl switchxkblayout all next

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, N, exec, swaync-client -swb

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume/Media
bindle = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindle = , XF86AudioLowerVolume, exec, pamixer -d 5
bindle = , XF86AudioMute, exec, pamixer -t
bindle = , XF86AudioPlay, exec, playerctl play-pause
bindle = , XF86AudioNext, exec, playerctl next
bindle = , XF86AudioPrev, exec, playerctl previous
bindle = , XF86AudioStop, exec, playerctl stop

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Base Rules
windowrule  {
	name = base
	match:class = .*,
	maximize= true
}

# Picture-in-Picture
windowrule {
	name = pip
  match:title = ^(Picture-in-Picture)$
  float = true
  pin = true
  move = 69.5% 4%
}

# Floating Window Groups
windowrule {
	name = float-large
  match:class = ^(center-float-large|.*qimgv.*|.*mpv.*)$
  float = true
  size = 70% 70%
  center = true
}

windowrule {
	name = float-small
  match:title = ^(Open Folder|Open File|Save File|Save Folder|Save Image|Save As|Open As|Extension: \(Bitwarden Password Manager\))$
  float = true
  size = 50% 50%
  center = true
}

windowrule {
 	name = float-mini
  match:class = ^(center-float-mini|galculator|ytdlp-gui|udiskie|Calculator)$
  float = true
  size = 30% 40%
  center = true
}

windowrule = match:class ^(xfce-polkit|wleave|nwg-look|nm-connection-editor|org.twosheds.iwgtk|overskride|satty)$, float 1
windowrule = match:class ^zen$ match:title ^Extension: \(Bitwarden Password Manager\).*, float 1

# Workspace Assignment
windowrule = match:class ^(virt-manager|PikaBackup|VirtualBox Manager|Vmware.*)$, workspace 8
windowrule = match:class ^(GParted|clamtk|gnome.Logs)$, workspace 17
windowrule = match:class ^(obsidian|Zotero)$, workspace 9 silent
windowrule = match:class ^(.*Code.*|codium|VSCodium|neovide|Ghostty|ghostty)$, workspace 1

# Animation/Visuals
windowrule = match:title ^.*cava.*$, animation slide
windowrule = match:class ^.*wleave.*$, animation popin
windowrule = match:class ^rofi$, opacity 0.65 0.65

# Opacity Overrides
windowrule = match:class ^(zen|edge)$, opacity 0.95 0.6
windowrule = match:title ^(.*YouTube.*|Picture-in-Picture|.*Mozilla.*|.*localhost.*|.*Edge.*|.*Cursor.*|.*Grayjay.*)$, opacity 1.0 override 1.0 override

# Satty
windowrule {
    name = satty-float
    match:title = satty
    
    float = true
    size = 1200 800
    center = true
}
#
# windowrule {
#     name = bitwarden-float
#     match:title = satty
#
#     float = true
#     size = 1200 800
#     center = true
# }


# Game Specific (Block Rule)
windowrule {
	name = game
  match:class = ^steam_app_\d+$
  monitor = HDMI-A-2
  fullscreen = true
  workspace = 10
  immediate = true
}

windowrule {
  name = steam-no-idle
  match:class = ^(steam|gamescope)$
  idle_inhibit = always
}

# Workspace Rules (Workspace keyword does not use match: prefix)
workspace = 10, monitor:HDMI-A-2, border:false, rounding:false
