# --- Kitty-protocol passthrough for Ghostty images ---
# 1) Use a Kitty-compatible TERM so the protocol is advertised
set -g default-terminal "xterm-kitty"
# 2) Tell tmux to never filter out passthrough sequences
set -g allow-passthrough on
# 3) Ensure true-color (Tc) and control-sequence passthrough (Cs) are enabled
set -ga terminal-overrides ",xterm-kitty:Tc:Cs"

# Prefix
# set-option -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# --- Basic Settings ---
# (you can remove the old xterm-256color overrides now)
#set -ga terminal-overrides ",xterm-256color:Tc"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g mouse on
set -g renumber-windows on           # Automatically updates window indices
set-option -g allow-rename off        # Don't rename windows automatically

# --- Keybindings ---
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind q kill-pane                     # Kill pane
bind n new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes (preserve cwd)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi-copy mode
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"

# Window navigation (Ctrl-h/l)
bind -n C-h previous-window
bind -n C-l next-window

# --- TPM Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'thepante/tmux-git-autofetch'

# Catppuccin Theme Settings
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_window_current_text "#{window_name}"
set -g @catppuccin_window_default_text "#{window_name}"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_status_modules_right "directory user host"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "yes"

# Status Bar Plugins
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Example Catppuccin separators (uncomment & adjust if desired)
# set -g @catppuccin_window_left_separator ""
# set -g @catppuccin_window_right_separator " "
# set -g @catppuccin_window_middle_separator " █"

# Status bar lengths
set -g status-left-length 100
set -g status-right-length 100

# Status bar content (using Catppuccin vars or direct formats)
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# --- Initialize TMUX Plugin Manager (must be last) ---
run '~/.tmux/plugins/tpm/tpm'
